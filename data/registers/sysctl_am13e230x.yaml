fieldset/X1CNT:
  description: x1cnt status register.
  fields:
  - name: X1CNT
    description: This counter increments on every X1 CLOCKs positive-edge. Once it reaches the values of 0x7ff, it freezes. Before switching from SYSOSC/PLL clock to X1, application must check this counter and make sure that it has saturated. This will ensure that the Crystal connected to X1/X2 is oscillating.
    bit_offset: 0
    bit_size: 11
  - name: CLR
    description: 'X1 Counter clear: A write of 1 to this bit field clears the X1CNT and makes it count from 0x0 again (provided X1 clock is ticking). Writes of 0 are ignore to this bit field.'
    bit_offset: 16
    bit_size: 1
fieldset/XTALCR:
  description: XTAL Control Register.
  fields:
  - name: OSCOFF
    description: This bit if 1, powers-down the XTAL oscillator macro and hence doesnt let X2 to be driven by the XTAL oscillator. If a crystal is connected to X1/X2, user needs to first clear this bit, wait for the oscillator to power up (using X1CNT) and then only switch the clock source to X1/X2.
    bit_offset: 0
    bit_size: 1
  - name: SE
    description: XTAL Oscilator in Single-Ended.
    bit_offset: 1
    bit_size: 1
fieldset/XTALCR2:
  description: XTAL Control Register for pad init.
  fields:
  - name: XIF
    description: XI Initial value deposited before XOSC start. Polarity selection to initialise XI/X1 pad of the XOSC before start-up. This value shall be deposited on the pad before XOSC started (XOSCOFF=1). If FEN=0 or XOSC is in XTAL or SE mode; then this value will not be applied to the pad.
    bit_offset: 0
    bit_size: 1
  - name: XOF
    description: XO Initial value deposited before XOSC start. Polarity selection to initialise XO/X2 pad of the XOSC before start-up. This value shall be deposited on the pad before XOSC started (XOSCOFF=1). If FEN=0 or XOSC is in XTAL or SE mode; then this value will not be applied to the pad.
    bit_offset: 1
    bit_size: 1
  - name: FEN
    description: XOSC pads initialisation enable. Configures XTAL oscillator pad initilisation. This register has effect only when XOSC is OFF (no SE , no XTAL mode). If this register is set during XOSC off state (XOSCOFF=1 & SE=0); then upon change of these controls this bit gets reset and rearmed.
    bit_offset: 2
    bit_size: 1
  - name: FKEEPXI
    description: 'This field when written 0xface allows to hold the force value on XI as programmed on XIF. 0xface: Force on XI is continued as per XIF value regardless of XOSC ON/OFF state only in XTAL mode. In Single ended mode this field has no impact. Any other value: Force on XI is removed with enabling of XOSC as per FEN function.'
    bit_offset: 16
    bit_size: 16
