fieldset/ANAREFCTL:
  description: Analog Reference Select.
  fields:
  - name: ANAREFSEL
    description: Analog reference mode select. This bit selects whether the VREFHI pin uses internal reference mode (the device drives a voltage onto the VREFHI pin) or external reference mode (the system is expected to drive a voltage into the VREFHI pin). 0 - Internal reference mode 1 - External reference mode.
    bit_offset: 0
    bit_size: 1
  - name: ANAREF2P5SEL
    description: Analog reference 2.5V source select. In internal reference mode, this bit selects which voltage the internal reference buffer drives onto the VREFHI pin. The buffer can drive either 1.65V onto the pin, resulting in a reference range of 0 to 3.3V, or the buffer can drive 2.5V onto the pin, resulting in a reference range of 0 to 2.5V. If switching between these two modes, the user must allow adequate time for the external capacitor to charge to the new voltage before using the ADC or buffered DAC. 0 - Internal 1.65V reference mode (3.3V reference range) 1 - Internal 2.5V reference mode (2.5V reference range).
    bit_offset: 8
    bit_size: 1
fieldset/CLKSTATUS:
  description: Clock module (CKM) status.
  fields:
  - name: SYSOSCFREQ
    description: SYSOSCFREQ indicates the current SYSOSC operating frequency.
    bit_offset: 0
    bit_size: 2
    enum: SYSOSCFREQ
  - name: HSCLKMUX
    description: HSCLKMUX indicates if MCLK is currently sourced from the high-speed clock (HSCLK).
    bit_offset: 4
    bit_size: 1
  - name: HFCLKGOOD
    description: HFCLKGOOD indicates that the HFCLK started correctly. When the XTAL is started or HFCLK_IN is selected as the HFCLK source, this bit will be set by hardware if a valid HFCLK is detected, and cleared if HFCLK is not operating within the expected range.
    bit_offset: 8
    bit_size: 1
  - name: SYSPLLGOOD
    description: SYSPLLGOOD indicates if the SYSPLL started correctly. When the SYSPLL is started, SYSPLLGOOD is cleared by hardware. After the startup settling time has expired, the SYSPLL status is tested. If the SYSPLL started successfully the SYSPLLGOOD bit is set, else it is left cleared.
    bit_offset: 9
    bit_size: 1
  - name: LFOSCGOOD
    description: LFOSCGOOD indicates when the LFOSC startup has completed and the LFOSC is ready for use.
    bit_offset: 11
    bit_size: 1
  - name: HSCLKSOFF
    description: HSCLKSOFF is set when the high speed clock sources (SYSPLL, HFCLK) are disabled or dead. It is the logical AND of HFCLKOFF and SYSPLLOFF.
    bit_offset: 12
    bit_size: 1
  - name: HFCLKOFF
    description: HFCLKOFF indicates if the HFCLK is disabled or was dead at startup. When the HFCLK is started, HFCLKOFF is cleared by hardware. Following startup of the HFCLK, if the HFCLK startup monitor determines that the HFCLK was not started correctly, HFCLKOFF is set.
    bit_offset: 13
    bit_size: 1
  - name: SYSPLLOFF
    description: SYSPLLOFF indicates if the SYSPLL is disabled or was dead at startup. When the SYSPLL is started, SYSPLLOFF is cleared by hardware. Following startup of the SYSPLL, if the SYSPLL startup monitor determines that the SYSPLL was not started correctly, SYSPLLOFF is set.
    bit_offset: 14
    bit_size: 1
  - name: CURHSCLKSEL
    description: CURHSCLKSEL indicates the current clock source for HSCLK.
    bit_offset: 16
    bit_size: 1
  - name: HSCLKDEAD
    description: HSCLKDEAD is set by hardware if the selected source for HSCLK was started but did not start successfully.
    bit_offset: 20
    bit_size: 1
  - name: HSCLKGOOD
    description: HSCLKGOOD is set by hardware if the selected clock source for HSCLK started successfully.
    bit_offset: 21
    bit_size: 1
  - name: FCLMODE
    description: FCLMODE indicates if the SYSOSC frequency correction loop (FCL) is enabled.
    bit_offset: 24
    bit_size: 1
  - name: FCCDONE
    description: FCCDONE indicates when a frequency clock counter capture is complete.
    bit_offset: 25
    bit_size: 1
  - name: HFCLKBLKUPD
    description: HFCLKBLKUPD indicates when writes to the HFCLKCLKCFG register are blocked.
    bit_offset: 28
    bit_size: 1
  - name: SYSPLLBLKUPD
    description: SYSPLLBLKUPD indicates when writes to SYSPLLCFG0/1 and SYSPLLPARAM0/1 are blocked.
    bit_offset: 29
    bit_size: 1
